# Static file server for the Clip Generator SPA build. This container sits
# behind Caddy (TLS + basic auth) on a single private domain — there is no
# multi-domain split and no public gallery/video pages (those belonged to the
# AI Shorts module, which this fork removed), so this is deliberately a much
# simpler config than a multi-tenant SaaS frontend would need.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed assets aggressively; never cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA routes entirely through the hash (no server-side routes to
    # fall back for), so unknown paths get a real 404 rather than the shell.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
